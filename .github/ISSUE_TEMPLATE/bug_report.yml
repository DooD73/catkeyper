name: Bug report
description: Report a problem with CatKeyper
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug. Please fill out as much as you can.

  - type: input
    id: version
    attributes:
      label: CatKeyper version
      placeholder: e.g. 1.0.0
    validations:
      required: true

  - type: input
    id: macos
    attributes:
      label: macOS version
      placeholder: e.g. 14.5 Sonoma
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: Describe the bug clearly.
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: List the steps so we can reproduce the issue.
      placeholder: |
        1. Open CatKeyper
        2. Click Lock Keyboard
        3. ...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: Optional. Run with `CATKEYPER_DEBUG=1` if relevant.
      render: shell

  - type: checkboxes
    id: accessibility
    attributes:
      label: Permissions
      options:
        - label: CatKeyper has Accessibility permission enabled in System Settings
          required: false
