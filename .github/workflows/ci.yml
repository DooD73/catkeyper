name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
          cache-dependency-path: go.sum

      - name: Verify module
        run: go mod verify

      - name: Run unit tests
        run: make test

      - name: Build binary
        run: go build -trimpath -ldflags "-s -w" -o build/catkeyper .

      - name: Build release artifacts
        run: make release

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: catkeyper-macos-build
          path: |
            build/CatKeyper.app
            build/catkeyper-*-macos.zip
            build/catkeyper-*-macos.dmg
          if-no-files-found: error
